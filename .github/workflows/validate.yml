name: validate
on: [push, pull_request]

# Read-only token: nothing here needs to write to the repository. The secret scan reads the
# commits of a pull request, which needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

# Third-party actions are pinned to a full commit SHA (the tag is in the comment).
# Dependabot opens a pull request when a newer release exists.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks reads the commit history
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Hygiene gate (blocked terms, secrets, syntax, SKILL.md size, doc drift, versions)
        run: bash scripts/check.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true   # Linux binaries from Posit Public Package Manager
      - name: Install the CRAN packages the helpers load
        run: Rscript -e 'install.packages(c("googlesheets4", "googledrive", "httr", "glue", "jsonlite"))'
      - name: Offline tests (no Google account, no network calls to Google)
        run: Rscript scripts/offline-test.R
